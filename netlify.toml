[build]
  command = "npm run build -w @morassistant/onshape-panel"
  publish = "apps/onshape-panel/dist"

[build.environment]
  NODE_VERSION = "22"
  # Keep browser requests on the iframe's public origin. Netlify proxies the
  # API path to Funnel below, avoiding private-network checks when Tailscale's
  # split DNS resolves the Funnel hostname to this Mac's 100.x address.
  VITE_API_ORIGIN = "https://morassistant-onshape.netlify.app"

[[redirects]]
  from = "/api/*"
  to = "https://macbook-air-2.tail8def8b.ts.net/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; connect-src 'self' https:; font-src 'self'; form-action 'self'; frame-ancestors 'self' https://*.onshape.com; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
